name: Architecture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deterministic-checks:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install deterministic check dependencies
        run: |
          brew install ripgrep
          sparkle_version="2.9.4"
          sparkle_sha256="ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9"
          sparkle_archive="$RUNNER_TEMP/Sparkle-$sparkle_version.tar.xz"
          sparkle_home="$RUNNER_TEMP/Sparkle-$sparkle_version"
          curl --fail --location --retry 3 \
            --output "$sparkle_archive" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz"
          echo "$sparkle_sha256  $sparkle_archive" | shasum -a 256 --check
          mkdir -p "$sparkle_home"
          tar -xJf "$sparkle_archive" -C "$sparkle_home"
          test -d "$sparkle_home/Sparkle.framework"
          test -f "$sparkle_home/Sparkle.framework/Headers/Sparkle.h"
          codesign --verify --deep --strict "$sparkle_home/Sparkle.framework"
          echo "SPARKLE_HOME=$sparkle_home" >> "$GITHUB_ENV"
      - name: Run deterministic architecture, build, and test checks
        run: ./scripts/check.sh --no-build
